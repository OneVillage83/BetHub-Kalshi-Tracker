services:
  postgres:
    image: postgres:16
    container_name: kalshi-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kalshi
      POSTGRES_PASSWORD: kalshi
      POSTGRES_DB: kalshi_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: kalshi-tracker-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
